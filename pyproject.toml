[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fact-preserving-kg-fusion"
version = "1.0.0"
description = "Fact-preserving hierarchical fusion of maintenance case knowledge graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20,<5",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "ruff>=0.6,<1"]
transformer = ["torch>=2.1", "transformers>=4.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["casefusion", "hierarchy_fusion"]
