hierarchy:
  input:
    case_graph_path: artifacts/case_graphs/case_graphs.jsonl
    source_graph_path: data/local_mcpg.jsonl
    document_embedding_path: artifacts/embeddings/document_bge.npz
    document_embedding_manifest: null
    event_embedding_path: null

  canonicalization:
    lexical_similarity_threshold: 0.92
    context_bge_similarity_threshold: 0.72
    neighbor_top_k: 10
    context_bge_neighbor_top_k: 50
    char_ngram_min: 2
    char_ngram_max: 4
    max_features: 30000

  patterns:
    max_path_edges: 4

  association:
    semantic_weight: 0.22
    evidence_weight: 0.78
    threshold: 0.19694262623786926

  candidate_top_k: 12
  backbone_max_cluster_size: 20

  residual:
    role: ROOT_CAUSE
    minimum_similarity: 0.0317785682709644
    allowed_candidate_types:
      - D_bge_high_structure_low
      - safe_or_low_risk_control
